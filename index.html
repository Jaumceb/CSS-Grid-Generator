<!DOCTYPE html>
  <html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Grid Generator - The easiest way to create responsive CSS grid layouts with a drag-and-drop editor. Customize columns, rows, and gaps, then export your code instantly!">
  <meta name="keywords" content="CSS Grid, CSS Grid Generator, responsive grid, web design tool, layout generator, drag and drop grid, HTML CSS generator, web development">
  <meta name="author" content="CSS Grid Generator">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="CSS Grid Generator - Create Custom Grid Layouts">
  <meta property="og:description" content="Easily generate CSS Grid layouts with our interactive tool. Customize rows, columns, and gaps, then get the ready-to-use HTML and CSS code.">
  <meta property="og:image" content="https://cssgridgenerator.netlify.app/img/Thumbnail-Grid-Generator.png">
  <meta property="og:url" content="https://cssgridgenerator.netlify.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CSS Grid Generator - Create Custom Grid Layouts">
  <meta name="twitter:description" content="Easily generate CSS Grid layouts with our interactive tool. Customize rows, columns, and gaps, then get the ready-to-use HTML and CSS code.">
  <meta name="twitter:image" content="https://cssgridgenerator.netlify.app/preview.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#5e4caf">
  <link rel="icon" type="image/png" href="img/favicon.png"> 
  <title>CSS Grid Generator - Create Responsive Layouts with Drag & Drop</title>
  <link rel="stylesheet" href="styles.css">
</head>    
<body>
  <main class="container">
    <header><h1>CSS Grid Generator</h1><a class="github-button" href="https://github.com/Jaumceb/CSS-Grid-Generator" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header>
    <p class="instructions">Add a block with +. Drag its number to move it or its corner to resize it. You can also use arrow keys or edit the selected block below. Wide grids scroll inside the preview.</p>
    <div class="controls" aria-label="Grid settings">
      <label>Columns<input type="number" id="columns" min="1" max="12" step="1" value="5"></label>
      <label>Rows<input type="number" id="rows" min="1" max="12" step="1" value="5"></label>
      <label>Gap (px)<input type="number" id="gap" min="0" max="48" step="1" value="8"></label>
    </div>
    <div class="grid-scroll" role="region" aria-label="Grid preview" tabindex="0"><div class="grid-container" id="gridContainer"></div></div>
    <form id="itemEditor" hidden>
      <h2 id="itemTitle">Selected block</h2>
      <label>Column<input type="number" name="col" min="1" step="1" required></label>
      <label>Row<input type="number" name="row" min="1" step="1" required></label>
      <label>Width (columns)<input type="number" name="width" min="1" step="1" required></label>
      <label>Height (rows)<input type="number" name="height" min="1" step="1" required></label>
      <button type="submit">Apply</button><button id="removeItem" type="button">Delete block</button>
    </form>
    <p id="status" role="status" aria-live="polite">Choose a cell to add your first block.</p>
    <section class="output" aria-label="Generated code">
      <div class="copy-container"><div class="output-header"><h2>CSS</h2><button data-copy="cssOutput">Copy CSS</button></div><textarea id="cssOutput" aria-label="Generated CSS" readonly spellcheck="false"></textarea></div>
      <div class="copy-container"><div class="output-header"><h2>HTML</h2><button data-copy="htmlOutput">Copy HTML</button></div><textarea id="htmlOutput" aria-label="Generated HTML" readonly spellcheck="false"></textarea></div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
